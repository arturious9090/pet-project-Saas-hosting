volumes:
  postgres_data:

services:
  db:
    image: postgres:16
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./
    container_name: app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
